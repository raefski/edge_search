[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripts"
version = "0.1.0"
description = "Free YouTube and podcast transcripts, with a ledger of which sources are worth reading"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
podcasts = ["faster-whisper"]

[tool.setuptools]
packages = ["transcripts"]
