name: Pick'em line capture

# STATUS 2026-09-08: this is the PAID FALLBACK, not the primary capture.
# ------------------------------------------------------------------------
# The free path (deploy/pickem-capture@.service on the desktop) reads the
# scraped board in data/odds.db, which a runner cannot use: the file is
# gitignored and 1.5GB, and a runner cannot rebuild it because DraftKings 403s
# datacenter IPs. So a capture from here can only go through the paid Odds API,
# and only if ODDS_API_KEY is set as a repository secret -- which it is not, as
# of 2026-09-08. Until then every scheduled run fails by design and banks
# nothing. Use the systemd timers; keep this for when the desktop is off.
#
# WHY THIS EXISTS
# ---------------
# data/pickem_line_log.csv is the project's only accumulating dataset, and the
# transferability measurement (PICKEM_MODEL.md 5j r6) depends on it. A market
# reading not taken at the right moment is gone forever -- the historical file
# cannot substitute, because it holds only two snapshots per game.
#
# The MARKET half of a capture is automatable; the CBS half needs a login and is
# done by hand. This workflow banks the market half on schedule so it never
# depends on anyone being at a computer, then commits it to the repo -- which is
# where the data actually accumulates. The two halves join on
# (season, week, home_team), so CBS's numbers can be filled in afterwards.
#
# SETUP (one time): add ODDS_API_KEY as a repository secret under
# Settings -> Secrets and variables -> Actions. Until that exists, every run
# will fail loudly rather than silently banking nothing.
#
# COST: 2 Odds-API credits per run, 3 runs/week = ~108 for a full season, inside
# the 500/month free tier shared with the MLB work.

on:
  workflow_dispatch:          # run it by hand first, to prove it works
    inputs:
      week:
        description: "NFL week number"
        required: true
      snapshot:
        description: "post | midweek | lock"
        required: true
        default: midweek
  schedule:
    # Times are UTC; the season runs Sept-Jan, so it spans a DST change. Every
    # time below is chosen to stay on the SAME UTC calendar day in both EDT and
    # EST -- an evening cron at 23:00 UTC would be Thursday in EDT and Friday in
    # EST, silently relabelling itself midway through the season. The ET times
    # in each comment are EDT / EST.
    #
    # There is one cron per DEADLINE, because the pool's deadline is per day --
    # the start of that day's first game - not one a week.
    - cron: "0 18 * * 2"      # Tue 14:00 / 13:00 ET -- just after CBS posts
    - cron: "0 22 * * 3"      # Wed 18:00 / 17:00 ET -- before a Wed opener (wk1)
    - cron: "0 22 * * 4"      # Thu 18:00 / 17:00 ET -- before the Thursday nighter
    - cron: "0 16 * * 5"      # Fri 12:00 / 11:00 ET -- the mid-week reading
    - cron: "0 16 * * 0"      # Sun 12:00 / 11:00 ET -- before the 1pm ET slate
    - cron: "0 22 * * 1"      # Mon 18:00 / 17:00 ET -- before Monday night

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit the appended row
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Work out week and snapshot label
        id: ctx
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
            echo "snap=${{ github.event.inputs.snapshot }}" >> "$GITHUB_OUTPUT"
          else
            # Everything below is decided in ET, because the pool is: CBS posts
            # on ET Tuesday and every deadline is an ET kickoff. Deriving the
            # week from UTC puts a Monday-night game in the following week.
            # Kept in sync with scripts/pickem_capture.py::current_week, which
            # is the authority -- this only exists to skip the off-season early.
            NOW=$(TZ=America/New_York date +%s)
            START=$(TZ=America/New_York date -d 2026-09-08 +%s)   # Tue of week 1
            WEEK=$(( (NOW - START) / 604800 + 1 ))
            # Each deadline gets its OWN label. edge/pickem_log.append() de-dupes
            # on (season, week, snapshot, home_team), so reusing a bare "lock"
            # would keep the first reading of the week and silently discard
            # every later one -- the opposite of what a per-day deadline needs.
            case "$(TZ=America/New_York date +%u)" in
              2) SNAP=post ;;
              3) SNAP=lock-wed ;;
              4) SNAP=lock-thu ;;
              5) SNAP=midweek ;;
              7) SNAP=lock-sun ;;
              1) SNAP=lock-mon ;;
              *) SNAP=lock ;;
            esac
            echo "week=$WEEK" >> "$GITHUB_OUTPUT"
            echo "snap=$SNAP" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY secret is not set -- nothing captured."
            exit 1
          fi
          W="${{ steps.ctx.outputs.week }}"
          if [ "$W" -lt 1 ] || [ "$W" -gt 18 ]; then
            echo "Week $W is outside the season. Nothing to do."
            exit 0
          fi
          python3 scripts/pickem_capture.py \
            --snapshot "${{ steps.ctx.outputs.snap }}" \
            --week "$W" --market-only --confirm --source paid

      - name: Commit the new rows
        run: |
          git config user.name  "pickem-capture[bot]"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/pickem_line_log.csv; then
            echo "No new rows (already captured, or nothing returned)."
            exit 0
          fi
          git add data/pickem_line_log.csv
          git commit -m "Pick'em capture: week ${{ steps.ctx.outputs.week }} ${{ steps.ctx.outputs.snap }} [skip ci]"
          git push
