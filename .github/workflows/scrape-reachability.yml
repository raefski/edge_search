name: Scrape reachability (datacenter IP)

# Answers one question: do the sportsbook endpoints answer a DATACENTER IP,
# or only a residential one? GitHub runners are datacenter hosts in the same
# class as Streamlit Community Cloud, so a pass here means the Arbitrage page
# can scan live in production and the committed snapshot is unnecessary.
#
# Read-only: a handful of GETs, no secrets, no credits, nothing written.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"     # Mon 11:00 ET, so drift gets noticed

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe each endpoint
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36")

          TARGETS = [
            ("FanDuel sbapi (CT)",
             "https://sbapi.ct.sportsbook.fanduel.com/api/content-managed-page"
             "?page=CUSTOM&customPageId=mlb&_ak=FhMFpcPWXMeyZxOx",
             {"Accept": "application/json"}, "attachments"),
            ("DraftKings leagues (CT)",
             "https://sportsbook-nash.draftkings.com/api/sportscontent/dkusct/v1/leagues/84240",
             {"Accept": "application/json",
              "Referer": "https://sportsbook.draftkings.com/"}, "events"),
            ("DraftKings NFL leagues",
             "https://sportsbook-nash.draftkings.com/api/sportscontent/dkusct/v1/leagues/88808",
             {"Accept": "application/json",
              "Referer": "https://sportsbook.draftkings.com/"}, "events"),
            ("Oddschecker (Fanatics)",
             "https://api.oddschecker.com/cx/v1/subevent-group"
             "?eventId=7445&betLimit=2&subeventLimit=3&bettypeIds=1&overrideBookies=FNP",
             {"accept": "application/json",
              "api-key": "b91c36c9-540c-4809-9328-bbdb276ad018",
              "content-type": "application/json", "country-code": "US",
              "origin": "https://betfanatics.com",
              "referer": "https://betfanatics.com/", "repub": "US",
              "subdivision-code": "CT"}, "subevents"),
            ("Fanatics Markets (anchor)",
             "https://api.fanaticsmarkets.com/events?series=MLB&limit=3",
             {"accept": "*/*", "origin": "https://fanaticsmarkets.com",
              "referer": "https://fanaticsmarkets.com/"}, "data"),
          ]

          rows, failures = [], 0
          for name, url, headers, key in TARGETS:
              req = urllib.request.Request(url, headers={"User-Agent": UA, **headers})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      status, note = r.status, ""
                      try:
                          payload = json.loads(body)
                          got = payload.get(key)
                          note = f"{len(got)} {key}" if got is not None else f"no '{key}'"
                          if not got:
                              failures += 1
                      except ValueError:
                          note, failures = "not JSON", failures + 1
              except urllib.error.HTTPError as exc:
                  status, note, failures = exc.code, "BLOCKED" if exc.code in (403, 429) else "error", failures + 1
              except Exception as exc:
                  status, note, failures = "ERR", str(exc)[:40], failures + 1
              rows.append((name, status, note))

          width = max(len(r[0]) for r in rows)
          lines = [f"{n:<{width}}  {str(s):>5}  {note}" for n, s, note in rows]
          print("\n".join(lines))

          verdict = ("All endpoints answer a datacenter IP — the Arbitrage page can "
                     "scan live in production."
                     if failures == 0 else
                     f"{failures}/{len(rows)} refused. Keep using the committed "
                     "snapshot from scripts/arb_scan.py.")
          print("\n" + verdict)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("## Scrape reachability from a datacenter IP\n\n")
                  fh.write("| endpoint | status | detail |\n|---|---|---|\n")
                  for n, s, note in rows:
                      fh.write(f"| {n} | `{s}` | {note} |\n")
                  fh.write(f"\n**{verdict}**\n")

          # Never fail the build: a block is a finding, not a broken pipeline.
          sys.exit(0)
          PY
